<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SLAX TV - منصة الترفيه والسينما</title>
    <style>
        :root {
            --bg-oled-black: #050505;
            --color-dark-crimson: #8B0000;
            --color-neon-red: #FF1E1E;
            --text-primary: #FFFFFF;
            --text-secondary: #D0D0D0;
            --glass-fallback: rgba(10, 10, 10, 0.85);
            --card-width: 180px;
            --card-height: 270px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }

        body {
            background-color: var(--bg-oled-black);
            /* تحسين وضوح صورة الخلفية لجعلها باينة بشكل واضح */
            background-image: linear-gradient(to bottom, rgba(5, 5, 5, 0.4), rgba(5, 5, 5, 0.75)), url('https://i.ibb.co/27tC8YZR/IMG-7795.jpg');
            background-size: cover;
            background-position: center center;
            background-repeat: no-repeat;
            background-attachment: fixed;
            color: var(--text-primary);
            font-family: system-ui, -apple-system, sans-serif;
            overflow-x: hidden;
        }

        /* SVG Icon styling */
        .svg-icon {
            width: 18px;
            height: 18px;
            fill: currentColor;
            vertical-align: middle;
            display: inline-block;
        }

        /* Navbar Layout */
        .navbar {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            height: 70px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 40px;
            background: var(--glass-fallback);
            border-bottom: 1px solid rgba(255, 30, 30, 0.3);
            z-index: 1000;
        }

        @supports (-webkit-backdrop-filter: blur(8px)) or (backdrop-filter: blur(8px)) {
            .navbar {
                background: rgba(10, 10, 10, 0.75);
                -webkit-backdrop-filter: blur(8px);
                backdrop-filter: blur(8px);
            }
        }

        .logo {
            font-size: 28px;
            font-weight: 900;
            color: var(--text-primary);
            letter-spacing: 2px;
            text-shadow: 0 0 10px rgba(255, 30, 30, 0.6);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .logo span { color: var(--color-neon-red); }

        .nav-links {
            display: flex;
            gap: 20px;
            list-style: none;
        }

        .nav-item a {
            color: var(--text-primary);
            text-decoration: none;
            font-size: 15px;
            padding: 8px 14px;
            border-radius: 4px;
            display: flex;
            align-items: center;
            gap: 6px;
            background: rgba(0,0,0,0.4);
            transition: color 0.2s, background 0.2s;
        }

        .nav-item a.active, .nav-item a.is-focused, .nav-item a:hover {
            color: var(--text-primary);
            background: rgba(255, 30, 30, 0.3);
            outline: 2px solid var(--color-neon-red);
        }

        /* Search Component */
        .search-box {
            position: relative;
            width: 260px;
        }

        .search-input {
            width: 100%;
            padding: 8px 16px 8px 36px;
            background: rgba(0, 0, 0, 0.6);
            border: 1px solid rgba(255, 30, 30, 0.4);
            border-radius: 20px;
            color: var(--text-primary);
            outline: none;
        }

        .search-input.is-focused, .search-input:focus {
            border-color: var(--color-neon-red);
            box-shadow: 0 0 8px rgba(255, 30, 30, 0.5);
        }

        .search-dropdown {
            position: absolute;
            top: 45px;
            left: 0;
            right: 0;
            background: var(--glass-fallback);
            border: 1px solid rgba(255, 30, 30, 0.3);
            border-radius: 8px;
            max-height: 350px;
            overflow-y: auto;
            display: none;
            z-index: 1001;
        }

        /* Hero Banner */
        .hero {
            position: relative;
            height: 60vh;
            margin-top: 70px;
            display: flex;
            align-items: flex-end;
            padding: 40px;
            background-size: cover;
            background-position: center top;
        }

        .hero-overlay {
            position: absolute;
            inset: 0;
            background: linear-gradient(to top, rgba(5,5,5,0.9) 10%, rgba(5,5,5,0.4) 60%, transparent 100%);
        }

        .hero-content {
            position: relative;
            z-index: 2;
            max-width: 650px;
        }

        .hero-title {
            font-size: 38px;
            font-weight: 800;
            margin-bottom: 12px;
            text-shadow: 0 2px 10px rgba(0,0,0,0.9);
        }

        .hero-meta {
            display: flex;
            align-items: center;
            gap: 15px;
            color: var(--text-secondary);
            font-size: 14px;
            margin-bottom: 16px;
        }

        .badge-rating {
            color: #FFD700;
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .btn-group {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
        }

        .btn {
            padding: 12px 24px;
            border-radius: 6px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            border: none;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            transition: transform 0.2s;
        }

        .btn-primary {
            background: var(--color-neon-red);
            color: var(--text-primary);
            box-shadow: 0 0 12px rgba(255, 30, 30, 0.4);
        }

        .btn-youtube {
            background: #FF0000;
            color: #FFFFFF;
        }

        .btn-external {
            background: #0056b3;
            color: #ffffff;
            border: 1px solid #007bff;
        }

        .btn.is-focused, .btn:hover {
            transform: scale(1.05);
            outline: 3px solid #FFFFFF;
        }

        /* Rows Architecture */
        .section-row {
            padding: 20px 40px;
        }

        .row-header {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 15px;
            border-right: 4px solid var(--color-neon-red);
            padding-right: 10px;
            background: rgba(0,0,0,0.5);
            display: inline-flex;
            padding-left: 15px;
            border-radius: 0 4px 4px 0;
        }

        .row-title {
            font-size: 20px;
        }

        .media-slider {
            display: flex;
            gap: 18px;
            overflow-x: auto;
            padding: 10px 0;
            scroll-behavior: smooth;
        }

        .media-slider::-webkit-scrollbar { display: none; }

        .media-card {
            flex: 0 0 var(--card-width);
            height: var(--card-height);
            border-radius: 8px;
            overflow: hidden;
            position: relative;
            background: rgba(20, 20, 20, 0.8);
            border: 1px solid rgba(255,255,255,0.1);
            transition: transform 0.2s, border 0.2s;
            will-change: transform;
            transform: translateZ(0);
            cursor: pointer;
        }

        .media-card img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .media-card .card-info {
            position: absolute;
            bottom: 0;
            inset-x: 0;
            padding: 8px;
            background: rgba(0,0,0,0.85);
            font-size: 12px;
            text-align: center;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .media-card.is-focused, .media-card:hover {
            transform: translate3d(0, 0, 0) scale(1.06);
            border: 2px solid var(--color-neon-red);
            box-shadow: 0 0 15px rgba(255, 30, 30, 0.5);
            z-index: 10;
        }

        /* Modal Player */
        .modal-player {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.95);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 2000;
        }

        .modal-player.active { display: flex; }

        .iframe-container {
            width: 88%;
            height: 82%;
            background: #000;
            border: 2px solid var(--color-dark-crimson);
            box-shadow: 0 0 20px rgba(255, 30, 30, 0.3);
            position: relative;
        }

        .close-modal {
            position: absolute;
            top: -40px;
            right: 0;
            color: var(--text-primary);
            font-size: 16px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .external-link-btn {
            position: absolute;
            top: -40px;
            left: 0;
            color: #007bff;
            font-size: 14px;
            text-decoration: underline;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <!-- Navbar -->
    <nav class="navbar">
        <div class="logo">
            <svg class="svg-icon" viewBox="0 0 24 24"><path d="M21 3H3c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h5v2h8v-2h5c1.1 0 1.99-.9 1.99-2L23 5c0-1.1-.9-2-2-2zm0 14H3V5h18v12z"/></svg>
            SLAX <span>TV</span>
        </div>
        <ul class="nav-links">
            <li class="nav-item">
                <a href="#" class="nav-link active">
                    <svg class="svg-icon" viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg> الرئيسي
                </a>
            </li>
            <li class="nav-item">
                <a href="#" class="nav-link">
                    <svg class="svg-icon" viewBox="0 0 24 24"><path d="M18 4l2 4h-3l-2-4h-2l2 4h-3l-2-4H8l2 4H7L5 4H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V4h-4z"/></svg> الأفلام
                </a>
            </li>
            <!-- فتح موقع يوتيوب المباشر -->
            <li class="nav-item">
                <a href="https://www.youtube.com" target="_blank" class="nav-link">
                    <svg class="svg-icon" viewBox="0 0 24 24" style="fill:#FF0000;"><path d="M23.498 6.186a3.016 3.016 0 0 0-2.122-2.136C19.505 3.545 12 3.545 12 3.545s-7.505 0-9.377.505A3.017 3.017 0 0 0 .502 6.186C0 8.07 0 12 0 12s0 3.93.502 5.814a3.016 3.016 0 0 0 2.122 2.136c1.871.505 9.376.505 9.376.505s7.505 0 9.377-.505a3.015 3.015 0 0 0 2.122-2.136C24 15.93 24 12 24 12s0-3.93-.502-5.814zM9.545 15.568V8.432L15.818 12l-6.273 3.568z"/></svg> فتح YouTube
                </a>
            </li>
            <!-- فتح موقع 3cktv المباشر -->
            <li class="nav-item">
                <a href="https://e.3cktv.com/video/cukur-dubbed-ep-54/" target="_blank" class="nav-link">
                    <svg class="svg-icon" viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 14.5v-9l6 4.5-6 4.5z"/></svg> موقع 3cktv
                </a>
            </li>
        </ul>
        <div class="search-box">
            <input type="text" class="search-input" id="searchInput" placeholder="بحث دقيق..." autocomplete="off">
            <div class="search-dropdown" id="searchDropdown"></div>
        </div>
    </nav>

    <!-- Hero Banner -->
    <header class="hero" id="heroBanner">
        <div class="hero-overlay"></div>
        <div class="hero-content">
            <h1 class="hero-title" id="heroTitle">جاري تحميل المحتوى...</h1>
            <div class="hero-meta">
                <span class="badge-rating">
                    <svg class="svg-icon" viewBox="0 0 24 24" style="fill:#FFD700;"><path d="M12 17.27L18.18 21l-1.64-7.03L22 9.24l-7.19-.61L12 2 9.19 8.63 2 9.24l5.46 4.73L5.82 21z"/></svg>
                    <span id="heroRating">--</span>
                </span>
                <span id="heroYear">2026</span>
                <span id="heroCategory">سينما أكشن</span>
            </div>
            <div class="btn-group">
                <button class="btn btn-primary" id="btnWatch">
                    <svg class="svg-icon" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg> مشاهدة الآن
                </button>
                <button class="btn btn-youtube" id="btnYouTubeDirect">
                    <svg class="svg-icon" viewBox="0 0 24 24" style="fill:#FFF;"><path d="M23.498 6.186a3.016 3.016 0 0 0-2.122-2.136C19.505 3.545 12 3.545 12 3.545s-7.505 0-9.377.505A3.017 3.017 0 0 0 .502 6.186C0 8.07 0 12 0 12s0 3.93.502 5.814a3.016 3.016 0 0 0 2.122 2.136c1.871.505 9.376.505 9.376.505s7.505 0 9.377-.505a3.015 3.015 0 0 0 2.122-2.136C24 15.93 24 12 24 12s0-3.93-.502-5.814zM9.545 15.568V8.432L15.818 12l-6.273 3.568z"/></svg> فتح يوتيوب
                </button>
                <button class="btn btn-external" id="btnCukur">
                    <svg class="svg-icon" viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 14.5v-9l6 4.5-6 4.5z"/></svg> الحفرة (3cktv)
                </button>
            </div>
        </div>
    </header>

    <!-- Media Sections -->
    <main>
        <!-- YouTube Section -->
        <section class="section-row">
            <div class="row-header">
                <svg class="svg-icon" viewBox="0 0 24 24" style="fill:#FF0000; width:24px; height:24px;"><path d="M23.498 6.186a3.016 3.016 0 0 0-2.122-2.136C19.505 3.545 12 3.545 12 3.545s-7.505 0-9.377.505A3.017 3.017 0 0 0 .502 6.186C0 8.07 0 12 0 12s0 3.93.502 5.814a3.016 3.016 0 0 0 2.122 2.136c1.871.505 9.376.505 9.376.505s7.505 0 9.377-.505a3.015 3.015 0 0 0 2.122-2.136C24 15.93 24 12 24 12s0-3.93-.502-5.814zM9.545 15.568V8.432L15.818 12l-6.273 3.568z"/></svg>
                <h2 class="row-title">مقاطع يوتيوب المختارة</h2>
            </div>
            <div class="media-slider" id="youtubeRow"></div>
        </section>

        <!-- TMDB Rows -->
        <section class="section-row">
            <div class="row-header">
                <svg class="svg-icon" viewBox="0 0 24 24" style="fill:#FF1E1E; width:22px; height:22px;"><path d="M13.5 1.5c.9 0 1.5.6 1.5 1.5v3.3l4.2-2.4c.8-.5 1.8-.2 2.2.6.5.8.2 1.8-.6 2.2L16.5 9l4.3 2.5c.8.5 1.1 1.5.6 2.3-.5.8-1.5 1.1-2.3.6L15 12v5c0 1.1-.9 2-2 2h-2c-1.1 0-2-.9-2-2v-5l-4.1 2.4c-.8.5-1.8.2-2.3-.6-.5-.8-.2-1.8.6-2.3L7.5 9 3.2 6.5c-.8-.5-1.1-1.5-.6-2.2.5-.8 1.5-1.1 2.2-.6L9 6.2V3c0-.9.6-1.5 1.5-1.5h3z"/></svg>
                <h2 class="row-title">الأكثر مشاهدة اليوم</h2>
            </div>
            <div class="media-slider" id="trendingRow"></div>
        </section>
    </main>

    <!-- Modal Video Player -->
    <div class="modal-player" id="videoModal">
        <div class="iframe-container">
            <div class="close-modal" id="closeModal">
                <svg class="svg-icon" viewBox="0 0 24 24"><path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg>
                إغلاق المشغل
            </div>
            <a id="externalDirectLink" href="#" target="_blank" class="external-link-btn">فتح الرابط المباشر في صفحة خارجية ↗</a>
            <iframe id="playerIframe" width="100%" height="100%" frameborder="0" allowfullscreen></iframe>
        </div>
    </div>

    <script>
        const TMDB_API_KEY = 'YOUR_TMDB_API_KEY';
        const BASE_URL = 'https://api.themoviedb.org/3';
        const IMAGE_BASE = 'https://image.tmdb.org/t/p/w500';

        const youtubeItems = [
            { id: 'dQw4w9WgXcQ', title: 'العرض التشويقي الأول', poster: 'https://img.youtube.com/vi/dQw4w9WgXcQ/hqdefault.jpg' },
            { id: 'L_LUpnjgPso', title: 'أفضل اللحظات السينمائية', poster: 'https://img.youtube.com/vi/L_LUpnjgPso/hqdefault.jpg' }
        ];

        const CUKUR_54_URL = 'https://e.3cktv.com/video/cukur-dubbed-ep-54/';

        async function fetchWithCache(url, cacheKey, ttlMinutes = 60) {
            const cached = localStorage.getItem(cacheKey);
            if (cached) {
                const { timestamp, data } = JSON.parse(cached);
                if (Date.now() - timestamp < ttlMinutes * 60 * 1000) return data;
            }
            try {
                const response = await fetch(url);
                const data = await response.json();
                localStorage.setItem(cacheKey, JSON.stringify({ timestamp: Date.now(), data }));
                return data;
            } catch (err) {
                return null;
            }
        }

        async function initApp() {
            renderYouTubeRow();

            const trendingData = await fetchWithCache(`${BASE_URL}/trending/movie/day?api_key=${TMDB_API_KEY}&language=ar-SA`, 'slax_trending', 120);
            if (trendingData && trendingData.results.length > 0) {
                setupHero(trendingData.results[0]);
                renderTMDBRow(trendingData.results, 'trendingRow');
            }

            // زر فتح يوتيوب المباشر
            document.getElementById('btnYouTubeDirect').onclick = () => {
                window.open('https://www.youtube.com', '_blank');
            };

            // زر فتح موقع 3cktv لمسلسل الحفرة
            document.getElementById('btnCukur').onclick = () => {
                openPlayer(CUKUR_54_URL, true);
            };

            setupSpatialNavigation();
            setupGamepadPolling();
        }

        function setupHero(item) {
            const hero = document.getElementById('heroBanner');
            const backdrop = item.backdrop_path ? `https://image.tmdb.org/t/p/original${item.backdrop_path}` : '';
            hero.style.backgroundImage = `url(${backdrop})`;
            document.getElementById('heroTitle').innerText = item.title || item.name;
            document.getElementById('heroRating').innerText = item.vote_average.toFixed(1);
            document.getElementById('heroYear').innerText = (item.release_date || '').split('-')[0] || '2026';
            document.getElementById('btnWatch').onclick = () => openPlayer(`https://vidsrc.to/embed/movie/${item.id}`);
        }

        function renderYouTubeRow() {
            const container = document.getElementById('youtubeRow');
            container.innerHTML = youtubeItems.map(item => `
                <div class="media-card nav-focusable" tabindex="0" onclick="openPlayer('https://www.youtube.com/embed/${item.id}', true)">
                    <img src="${item.poster}" alt="${item.title}" loading="lazy">
                    <div class="card-info">${item.title}</div>
                </div>
            `).join('');
        }

        function renderTMDBRow(items, elementId) {
            const container = document.getElementById(elementId);
            container.innerHTML = items.map(item => `
                <div class="media-card nav-focusable" tabindex="0" onclick="openPlayer('https://vidsrc.to/embed/movie/${item.id}')">
                    <img src="${item.poster_path ? IMAGE_BASE + item.poster_path : ''}" alt="${item.title}" loading="lazy">
                    <div class="card-info">${item.title || item.name}</div>
                </div>
            `).join('');
        }

        function openPlayer(url, isExternal = false) {
            const modal = document.getElementById('videoModal');
            const iframe = document.getElementById('playerIframe');
            const extBtn = document.getElementById('externalDirectLink');
            
            iframe.src = url;
            extBtn.href = url;
            extBtn.style.display = isExternal ? 'block' : 'none';
            modal.classList.add('active');
        }

        document.getElementById('closeModal').onclick = () => {
            const modal = document.getElementById('videoModal');
            const iframe = document.getElementById('playerIframe');
            iframe.src = '';
            modal.classList.remove('active');
        };

        function setupSpatialNavigation() {
            let focusables = document.querySelectorAll('.nav-focusable, .btn, .search-input, .nav-link');
            let currentIndex = 0;

            function updateFocus(index) {
                focusables.forEach(el => el.classList.remove('is-focused'));
                if (focusables[index]) {
                    focusables[index].classList.add('is-focused');
                    focusables[index].focus();
                    focusables[index].scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'center' });
                }
            }

            document.addEventListener('keydown', (e) => {
                focusables = document.querySelectorAll('.nav-focusable, .btn, .search-input, .nav-link');
                if (e.key === 'ArrowRight') {
                    currentIndex = (currentIndex > 0) ? currentIndex - 1 : focusables.length - 1;
                    updateFocus(currentIndex);
                } else if (e.key === 'ArrowLeft') {
                    currentIndex = (currentIndex < focusables.length - 1) ? currentIndex + 1 : 0;
                    updateFocus(currentIndex);
                } else if (e.key === 'Enter') {
                    if (focusables[currentIndex]) focusables[currentIndex].click();
                }
            });
        }

        function setupGamepadPolling() {
            let lastAxisTime = 0;
            function pollGamepad() {
                const gamepads = navigator.getGamepads ? navigator.getGamepads() : [];
                const gp = gamepads[0];
                if (gp) {
                    const now = Date.now();
                    if (now - lastAxisTime > 250) {
                        if (gp.axes[0] > 0.5) {
                            document.dispatchEvent(new KeyboardEvent('keydown', { key: 'ArrowLeft' }));
                            lastAxisTime = now;
                        } else if (gp.axes[0] < -0.5) {
                            document.dispatchEvent(new KeyboardEvent('keydown', { key: 'ArrowRight' }));
                            lastAxisTime = now;
                        }
                    }
                    if (gp.buttons[0].pressed) {
                        document.dispatchEvent(new KeyboardEvent('keydown', { key: 'Enter' }));
                    }
                }
                requestAnimationFrame(pollGamepad);
            }
            requestAnimationFrame(pollGamepad);
        }

        window.onload = initApp;
    </script>
</body>
</html>

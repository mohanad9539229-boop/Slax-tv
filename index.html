<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SLAX TV - السينما بين يديك</title>
    <style>
        :root {
            --bg-oled-black: #050505;
            --color-dark-crimson: #8B0000;
            --color-neon-red: #FF1E1E;
            --text-primary: #FFFFFF;
            --text-secondary: #A0A0A0;
            --glass-fallback: rgba(10, 10, 10, 0.92);
            --card-width: 180px;
            --card-height: 270px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }

        body {
            background-color: var(--bg-oled-black);
            color: var(--text-primary);
            font-family: system-ui, -apple-system, sans-serif;
            overflow-x: hidden;
            background-image: radial-gradient(circle at top center, rgba(139, 0, 0, 0.15) 0%, transparent 70%);
        }

        /* Navbar Layout */
        .navbar {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            height: 70px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 40px;
            background: var(--glass-fallback);
            border-bottom: 1px solid rgba(255, 30, 30, 0.2);
            z-index: 1000;
        }

        @supports (-webkit-backdrop-filter: blur(10px)) or (backdrop-filter: blur(10px)) {
            .navbar {
                background: rgba(10, 10, 10, 0.75);
                -webkit-backdrop-filter: blur(10px);
                backdrop-filter: blur(10px);
            }
        }

        .logo {
            font-size: 28px;
            font-weight: 900;
            color: var(--text-primary);
            letter-spacing: 2px;
            text-shadow: 0 0 10px rgba(255, 30, 30, 0.6);
        }

        .logo span { color: var(--color-neon-red); }

        .nav-links {
            display: flex;
            gap: 25px;
            list-style: none;
        }

        .nav-item a {
            color: var(--text-secondary);
            text-decoration: none;
            font-size: 16px;
            padding: 8px 12px;
            border-radius: 4px;
            transition: color 0.2s, background 0.2s;
        }

        .nav-item a.active, .nav-item a.is-focused, .nav-item a:hover {
            color: var(--text-primary);
            background: rgba(255, 30, 30, 0.15);
            outline: 2px solid var(--color-neon-red);
        }

        /* Live Search Component */
        .search-box {
            position: relative;
            width: 280px;
        }

        .search-input {
            width: 100%;
            padding: 8px 16px;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 30, 30, 0.3);
            border-radius: 20px;
            color: var(--text-primary);
            outline: none;
        }

        .search-input.is-focused, .search-input:focus {
            border-color: var(--color-neon-red);
            box-shadow: 0 0 8px rgba(255, 30, 30, 0.5);
        }

        .search-dropdown {
            position: absolute;
            top: 45px;
            left: 0;
            right: 0;
            background: var(--glass-fallback);
            border: 1px solid rgba(255, 30, 30, 0.3);
            border-radius: 8px;
            max-height: 350px;
            overflow-y: auto;
            display: none;
            z-index: 1001;
        }

        /* Hero Banner Component */
        .hero {
            position: relative;
            height: 70vh;
            margin-top: 70px;
            display: flex;
            align-items: flex-end;
            padding: 60px 40px;
            background-size: cover;
            background-position: center top;
        }

        .hero-overlay {
            position: absolute;
            inset: 0;
            background: linear-gradient(to top, var(--bg-oled-black) 5%, rgba(5,5,5,0.6) 50%, transparent 100%);
        }

        .hero-content {
            position: relative;
            z-index: 2;
            max-width: 600px;
        }

        .hero-title {
            font-size: 42px;
            font-weight: 800;
            margin-bottom: 12px;
            text-shadow: 0 2px 10px rgba(0,0,0,0.8);
        }

        .hero-meta {
            display: flex;
            gap: 15px;
            color: var(--text-secondary);
            font-size: 14px;
            margin-bottom: 16px;
        }

        .badge-rating {
            color: #FFD700;
            font-weight: bold;
        }

        .btn-group {
            display: flex;
            gap: 15px;
        }

        .btn {
            padding: 12px 28px;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            border: none;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .btn-primary {
            background: var(--color-neon-red);
            color: var(--text-primary);
            box-shadow: 0 0 12px rgba(255, 30, 30, 0.4);
        }

        .btn-secondary {
            background: rgba(255, 255, 255, 0.1);
            color: var(--text-primary);
            border: 1px solid rgba(255, 255, 255, 0.3);
        }

        .btn.is-focused, .btn:hover {
            transform: scale(1.05);
            outline: 3px solid #FFFFFF;
        }

        /* Media Rows Layout */
        .section-row {
            padding: 20px 40px;
        }

        .row-title {
            font-size: 20px;
            margin-bottom: 15px;
            border-right: 4px solid var(--color-neon-red);
            padding-right: 10px;
        }

        .media-slider {
            display: flex;
            gap: 18px;
            overflow-x: auto;
            padding: 10px 0;
            scroll-behavior: smooth;
        }

        .media-slider::-webkit-scrollbar { display: none; }

        .media-card {
            flex: 0 0 var(--card-width);
            height: var(--card-height);
            border-radius: 8px;
            overflow: hidden;
            position: relative;
            background: #151515;
            transition: transform 0.2s, border 0.2s;
            will-change: transform;
            transform: translateZ(0);
        }

        .media-card img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .media-card.is-focused, .media-card:hover {
            transform: translate3d(0, 0, 0) scale(1.06);
            border: 2px solid var(--color-neon-red);
            box-shadow: 0 0 15px rgba(255, 30, 30, 0.5);
            z-index: 10;
        }

        /* Custom Modal Player */
        .modal-player {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.95);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 2000;
        }

        .modal-player.active { display: flex; }

        .iframe-container {
            width: 85%;
            height: 80%;
            background: #000;
            border: 2px solid var(--color-dark-crimson);
            box-shadow: 0 0 20px rgba(255, 30, 30, 0.3);
            position: relative;
        }

        .close-modal {
            position: absolute;
            top: -40px;
            right: 0;
            color: var(--text-primary);
            font-size: 24px;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <!-- Navbar -->
    <nav class="navbar">
        <div class="logo">SLAX <span>TV</span></div>
        <ul class="nav-links">
            <li class="nav-item"><a href="#" class="nav-link active">الرئيسية</a></li>
            <li class="nav-item"><a href="#" class="nav-link">الأفلام</a></li>
            <li class="nav-item"><a href="#" class="nav-link">المسلسلات</a></li>
            <li class="nav-item"><a href="#" class="nav-link">المفضلة</a></li>
        </ul>
        <div class="search-box">
            <input type="text" class="search-input" id="searchInput" placeholder="بحث دقيق عن أعمال..." autocomplete="off">
            <div class="search-dropdown" id="searchDropdown"></div>
        </div>
    </nav>

    <!-- Hero Banner -->
    <header class="hero" id="heroBanner">
        <div class="hero-overlay"></div>
        <div class="hero-content">
            <h1 class="hero-title" id="heroTitle">جاري التحميل...</h1>
            <div class="hero-meta">
                <span class="badge-rating" id="heroRating">★ --</span>
                <span id="heroYear">2026</span>
                <span id="heroCategory">سينما أكشن</span>
            </div>
            <div class="btn-group">
                <button class="btn btn-primary" id="btnWatch">▶ مشاهدة الآن</button>
                <button class="btn btn-secondary" id="btnFav">+ المفضلة</button>
            </div>
        </div>
    </header>

    <!-- Media Sections -->
    <main>
        <section class="section-row">
            <h2 class="row-title">الأكثر مشاهدة اليوم</h2>
            <div class="media-slider" id="trendingRow"></div>
        </section>
        <section class="section-row">
            <h2 class="row-title">أحدث الإصدارات السينمائية</h2>
            <div class="media-slider" id="latestRow"></div>
        </section>
    </main>

    <!-- Modal Video Player -->
    <div class="modal-player" id="videoModal">
        <div class="iframe-container">
            <span class="close-modal" id="closeModal">&times; إغلاق (Circle)</span>
            <iframe id="playerIframe" width="100%" height="100%" frameborder="0" allowfullscreen></iframe>
        </div>
    </div>

    <script>
        /**
         * Slax TV Engine - Optimized for PS4 WebKit
         */
        const TMDB_API_KEY = 'YOUR_TMDB_API_KEY';
        const BASE_URL = 'https://api.themoviedb.org/3';
        const IMAGE_BASE = 'https://image.tmdb.org/t/p/w500';

        // Local Storage Caching Strategy (30 reqs/10s rate limit defense)
        async function fetchWithCache(url, cacheKey, ttlMinutes = 60) {
            const cached = localStorage.getItem(cacheKey);
            if (cached) {
                const { timestamp, data } = JSON.parse(cached);
                if (Date.now() - timestamp < ttlMinutes * 60 * 1000) {
                    return data;
                }
            }
            try {
                const response = await fetch(url);
                const data = await response.json();
                localStorage.setItem(cacheKey, JSON.stringify({ timestamp: Date.now(), data }));
                return data;
            } catch (err) {
                console.error("Fetch failure:", err);
                return null;
            }
        }

        // Initialize Application
        async function initApp() {
            const trendingData = await fetchWithCache(`${BASE_URL}/trending/movie/day?api_key=${TMDB_API_KEY}&language=ar-SA`, 'slax_trending', 120);
            if (trendingData && trendingData.results.length > 0) {
                setupHero(trendingData.results[0]);
                renderRow(trendingData.results, 'trendingRow');
            }

            const latestData = await fetchWithCache(`${BASE_URL}/movie/now_playing?api_key=${TMDB_API_KEY}&language=ar-SA`, 'slax_latest', 120);
            if (latestData && latestData.results) {
                renderRow(latestData.results, 'latestRow');
            }

            setupSpatialNavigation();
            setupGamepadPolling();
        }

        function setupHero(item) {
            const hero = document.getElementById('heroBanner');
            const backdrop = item.backdrop_path ? `https://image.tmdb.org/t/p/original${item.backdrop_path}` : '';
            hero.style.backgroundImage = `url(${backdrop})`;
            document.getElementById('heroTitle').innerText = item.title || item.name;
            document.getElementById('heroRating').innerText = `★ ${item.vote_average.toFixed(1)}`;
            document.getElementById('heroYear').innerText = (item.release_date || '').split('-')[0] || '2026';
            
            document.getElementById('btnWatch').onclick = () => openPlayer(item.id);
        }

        function renderRow(items, elementId) {
            const container = document.getElementById(elementId);
            container.innerHTML = items.map(item => `
                <div class="media-card nav-focusable" tabindex="0" data-id="${item.id}">
                    <img src="${item.poster_path ? IMAGE_BASE + item.poster_path : ''}" alt="${item.title}" loading="lazy">
                </div>
            `).join('');

            container.querySelectorAll('.media-card').forEach(card => {
                card.addEventListener('click', () => openPlayer(card.dataset.id));
            });
        }

        // Modal Controls
        function openPlayer(movieId) {
            const modal = document.getElementById('videoModal');
            const iframe = document.getElementById('playerIframe');
            iframe.src = `https://vidsrc.to/embed/movie/${movieId}`;
            modal.classList.add('active');
        }

        document.getElementById('closeModal').onclick = () => {
            const modal = document.getElementById('videoModal');
            const iframe = document.getElementById('playerIframe');
            iframe.src = '';
            modal.classList.remove('active');
        };

        // Live Search Debounce Engine
        let debounceTimer;
        document.getElementById('searchInput').addEventListener('input', (e) => {
            clearTimeout(debounceTimer);
            const query = e.target.value.trim();
            if (query.length < 2) {
                document.getElementById('searchDropdown').style.display = 'none';
                return;
            }
            debounceTimer = setTimeout(async () => {
                const res = await fetch(`${BASE_URL}/search/multi?api_key=${TMDB_API_KEY}&query=${encodeURIComponent(query)}&language=ar-SA`);
                const data = await res.json();
                if (data.results) {
                    const dropdown = document.getElementById('searchDropdown');
                    dropdown.innerHTML = data.results.slice(0, 5).map(item => `
                        <div style="padding: 10px; display: flex; gap: 10px; align-items: center; border-bottom: 1px solid #222;" onclick="openPlayer(${item.id})">
                            <img src="${item.poster_path ? IMAGE_BASE + item.poster_path : ''}" style="width: 40px; height: 60px; object-fit: cover;">
                            <div>
                                <div style="font-weight: bold; font-size: 14px;">${item.title || item.name}</div>
                                <div style="font-size: 12px; color: #888;">${(item.release_date || item.first_air_date || '').split('-')[0]}</div>
                            </div>
                        </div>
                    `).join('');
                    dropdown.style.display = 'block';
                }
            }, 350);
        });

        // Spatial Focus Management
        function setupSpatialNavigation() {
            let focusables = document.querySelectorAll('.nav-focusable, .btn, .search-input, .nav-link');
            let currentIndex = 0;

            function updateFocus(index) {
                focusables.forEach(el => el.classList.remove('is-focused'));
                if (focusables[index]) {
                    focusables[index].classList.add('is-focused');
                    focusables[index].focus();
                    focusables[index].scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'center' });
                }
            }

            document.addEventListener('keydown', (e) => {
                focusables = document.querySelectorAll('.nav-focusable, .btn, .search-input, .nav-link');
                if (e.key === 'ArrowRight') {
                    currentIndex = (currentIndex > 0) ? currentIndex - 1 : focusables.length - 1;
                    updateFocus(currentIndex);
                } else if (e.key === 'ArrowLeft') {
                    currentIndex = (currentIndex < focusables.length - 1) ? currentIndex + 1 : 0;
                    updateFocus(currentIndex);
                } else if (e.key === 'Enter') {
                    if (focusables[currentIndex]) focusables[currentIndex].click();
                }
            });
        }

        // Gamepad API Loop for PS4 DualShock Controller
        function setupGamepadPolling() {
            let lastAxisTime = 0;
            function pollGamepad() {
                const gamepads = navigator.getGamepads ? navigator.getGamepads() : [];
                const gp = gamepads[0];
                if (gp) {
                    const now = Date.now();
                    if (now - lastAxisTime > 250) {
                        if (gp.axes[0] > 0.5) {
                            document.dispatchEvent(new KeyboardEvent('keydown', { key: 'ArrowLeft' }));
                            lastAxisTime = now;
                        } else if (gp.axes[0] < -0.5) {
                            document.dispatchEvent(new KeyboardEvent('keydown', { key: 'ArrowRight' }));
                            lastAxisTime = now;
                        }
                    }
                    if (gp.buttons[0].pressed) {
                        document.dispatchEvent(new KeyboardEvent('keydown', { key: 'Enter' }));
                    }
                }
                requestAnimationFrame(pollGamepad);
            }
            requestAnimationFrame(pollGamepad);
        }

        window.onload = initApp;
    </script>
</body>
</html>

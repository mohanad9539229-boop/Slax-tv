<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SLAX TV - Smart TV Platform</title>
    <style>
        :root {
            --bg-color: #0b0d12;
            --card-width: 200px;
            --card-height: 300px;
            --accent-color: #e50914;
            --glow-color: rgba(229, 9, 20, 0.75);
            --focus-border: #ffffff;
            --text-main: #f5f5f1;
            --text-muted: #a3a3a3;
            --surface-dark: rgba(20, 24, 33, 0.85);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: var(--bg-color);
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            color: var(--text-main);
            direction: rtl;
        }

        /* إطار التركيز الفضائي الموحد المتنقل */
        .focus-glow {
            position: absolute;
            top: 0;
            left: 0;
            pointer-events: none;
            z-index: 9999;
            border: 4px solid var(--focus-border);
            border-radius: 8px;
            box-shadow: 0 0 25px var(--glow-color), inset 0 0 15px rgba(255, 255, 255, 0.2);
            transition: transform 0.15s cubic-bezier(0.2, 0, 0.2, 1), 
                        width 0.15s cubic-bezier(0.2, 0, 0.2, 1), 
                        height 0.15s cubic-bezier(0.2, 0, 0.2, 1);
            opacity: 0;
            will-change: transform, width, height;
        }

        .focus-glow.active {
            opacity: 1;
        }

        /* التنسيق العام للشاشات */
        .view-section {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.3s ease;
            overflow: hidden;
        }

        .view-section.active-view {
            opacity: 1;
            visibility: visible;
        }

        /* الشريط العلوي */
        .app-header {
            position: absolute;
            top: 0;
            right: 0;
            left: 0;
            height: 80px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 40px;
            z-index: 100;
            background: linear-gradient(180deg, rgba(0,0,0,0.9) 0%, rgba(0,0,0,0) 100%);
        }

        .logo {
            font-size: 28px;
            font-weight: 900;
            color: var(--accent-color);
            letter-spacing: 2px;
        }

        .nav-menu {
            display: flex;
            gap: 15px;
        }

        .nav-item {
            background: transparent;
            border: none;
            color: var(--text-muted);
            font-size: 18px;
            font-weight: 600;
            padding: 10px 20px;
            border-radius: 6px;
            outline: none;
        }

        /* قسم Hero */
        .hero-section {
            position: relative;
            width: 100%;
            height: 55vh;
            display: flex;
            align-items: center;
            padding: 0 50px;
        }

        .hero-backdrop {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-size: cover;
            background-position: center top;
            filter: brightness(0.65);
        }

        .hero-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, var(--bg-color) 0%, rgba(11,13,18,0.6) 50%, transparent 100%),
                        linear-gradient(0deg, var(--bg-color) 0%, transparent 60%);
        }

        .hero-content {
            position: relative;
            z-index: 10;
            max-width: 650px;
            margin-top: 40px;
        }

        .hero-title {
            font-size: 44px;
            font-weight: 800;
            margin-bottom: 12px;
            text-shadow: 0 2px 10px rgba(0,0,0,0.8);
        }

        .hero-meta {
            display: flex;
            gap: 12px;
            margin-bottom: 12px;
        }

        .meta-badge {
            background: rgba(255,255,255,0.15);
            padding: 4px 10px;
            border-radius: 4px;
            font-size: 14px;
        }

        .meta-badge.rating {
            background: #e5a93c;
            color: #000;
            font-weight: bold;
        }

        .hero-description {
            font-size: 15px;
            color: var(--text-muted);
            line-height: 1.5;
            margin-bottom: 20px;
            display: -webkit-box;
            -webkit-line-clamp: 3;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .hero-actions {
            display: flex;
            gap: 15px;
        }

        .btn {
            padding: 12px 28px;
            font-size: 16px;
            font-weight: 700;
            border: none;
            border-radius: 6px;
            outline: none;
        }

        .btn-primary { background-color: var(--accent-color); color: #fff; }
        .btn-secondary { background-color: rgba(255,255,255,0.2); color: #fff; }
        .btn-tertiary { background-color: rgba(255,255,255,0.1); color: var(--text-muted); }

        /* الرفوف الأفقية */
        .rails-container {
            position: relative;
            width: 100%;
            padding-right: 50px;
            transform: translate3d(0, 0, 0);
            will-change: transform;
            transition: transform 0.3s ease-out;
        }

        .rail-group {
            margin-bottom: 25px;
        }

        .rail-title {
            font-size: 20px;
            font-weight: 700;
            margin-bottom: 10px;
            color: var(--text-main);
        }

        .rail-track {
            display: flex;
            gap: 20px;
            transform: translate3d(0, 0, 0);
            will-change: transform;
            transition: transform 0.3s ease-out;
        }

        /* بطاقات المحتوى */
        .card {
            position: relative;
            flex: 0 0 var(--card-width);
            height: var(--card-height);
            border-radius: 8px;
            overflow: hidden;
            background-color: var(--surface-dark);
            contain: layout style paint;
        }

        .card img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .card-info {
            position: absolute;
            bottom: 0;
            right: 0;
            left: 0;
            padding: 10px;
            background: linear-gradient(0deg, rgba(0,0,0,0.9) 0%, transparent 100%);
        }

        .card-title {
            font-size: 14px;
            font-weight: 600;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* صفحة التفاصيل */
        .details-backdrop {
            position: absolute;
            width: 100%;
            height: 100%;
            background-size: cover;
            background-position: center;
            filter: blur(8px) brightness(0.3);
            transform: scale(1.05);
        }

        .details-overlay {
            position: absolute;
            width: 100%;
            height: 100%;
            background: rgba(11, 13, 18, 0.85);
        }

        .details-content-wrapper {
            position: relative;
            z-index: 10;
            display: flex;
            gap: 50px;
            padding: 80px 80px 0 80px;
        }

        .details-poster-box {
            width: 280px;
            height: 420px;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
            flex-shrink: 0;
        }

        .details-poster-box img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .details-info {
            flex: 1;
        }

        .section-subtitle {
            font-size: 18px;
            margin: 20px 0 10px 0;
        }

        .episodes-rail {
            display: flex;
            gap: 10px;
            overflow-x: visible;
        }

        /* لوحة المفاتيح الافتراضية للبحث */
        .search-layout {
            padding: 90px 50px 30px 50px;
            display: flex;
            flex-direction: column;
            height: 100vh;
        }

        .search-input-container {
            background: rgba(255,255,255,0.1);
            padding: 15px 25px;
            border-radius: 8px;
            margin-bottom: 25px;
            font-size: 22px;
        }

        .search-body {
            display: flex;
            gap: 40px;
            flex: 1;
        }

        .keyboard-grid {
            display: grid;
            grid-template-columns: repeat(6, 60px);
            gap: 10px;
            background: rgba(0,0,0,0.4);
            padding: 20px;
            border-radius: 12px;
            height: fit-content;
        }

        .key-btn {
            width: 60px;
            height: 60px;
            background: rgba(255,255,255,0.08);
            border: none;
            border-radius: 8px;
            color: #fff;
            font-size: 20px;
            font-weight: bold;
            outline: none;
        }

        .key-btn.wide {
            grid-column: span 2;
            width: 130px;
        }

        .search-results-container {
            flex: 1;
            overflow: hidden;
        }

        .search-results-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 20px;
            margin-top: 15px;
        }

        .hidden { display: none !important; }
    </style>
</head>

        /* محرك التنقل الفضائي بالريموت المخصص لمتصفح PS4 */
        const SpatialNavigation = (function () {
            let currentFocusedElement = null;
            let focusGlowBox = null;
            let isThrottled = false;
            const THROTTLE_DELAY = 110;

            function init() {
                focusGlowBox = document.getElementById('focus-glow-box');
                window.addEventListener('keydown', handleKeyDown);
            }

            function handleKeyDown(e) {
                const keyCode = e.keyCode || e.which;
                const key = e.key;

                if ([37, 38, 39, 40, 13, 8, 27].includes(keyCode) || 
                    ['ArrowLeft', 'ArrowUp', 'ArrowRight', 'ArrowDown', 'Enter', 'Backspace', 'Escape'].includes(key)) {
                    e.preventDefault();
                }

                if (isThrottled) return;
                isThrottled = true;
                setTimeout(() => { isThrottled = false; }, THROTTLE_DELAY);

                switch (key) {
                    case 'ArrowLeft':
                    case 37:
                        navigate('left');
                        break;
                    case 'ArrowUp':
                    case 38:
                        navigate('up');
                        break;
                    case 'ArrowRight':
                    case 39:
                        navigate('right');
                        break;
                    case 'ArrowDown':
                    case 40:
                        navigate('down');
                        break;
                    case 'Enter':
                    case 13:
                        if (currentFocusedElement) currentFocusedElement.click();
                        break;
                    case 'Backspace':
                    case 'Escape':
                    case 27:
                    case 8:
                    case 10009:
                        App.handleBackKey();
                        break;
                }
            }

            function navigate(direction) {
                const activeView = document.querySelector('.view-section.active-view');
                if (!activeView) return;

                const focusables = Array.from(activeView.querySelectorAll('.focusable'))
                    .filter(el => el.offsetWidth > 0 && el.offsetHeight > 0 && getComputedStyle(el).visibility !== 'hidden');

                if (focusables.length === 0) return;

                if (!currentFocusedElement || !activeView.contains(currentFocusedElement)) {
                    focusElement(focusables[0]);
                    return;
                }

                const nextElement = findBestCandidate(currentFocusedElement, focusables, direction);
                if (nextElement) {
                    focusElement(nextElement);
                    autoScrollContainer(nextElement, direction);
                }
            }

            function findBestCandidate(current, candidates, direction) {
                const currentRect = current.getBoundingClientRect();
                const currentCenter = {
                    x: currentRect.left + currentRect.width / 2,
                    y: currentRect.top + currentRect.height / 2
                };

                let bestCandidate = null;
                let shortestDistance = Infinity;

                candidates.forEach(candidate => {
                    if (candidate === current) return;

                    const rect = candidate.getBoundingClientRect();
                    const center = {
                        x: rect.left + rect.width / 2,
                        y: rect.top + rect.height / 2
                    };

                    const dx = center.x - currentCenter.x;
                    const dy = center.y - currentCenter.y;

                    let isInDirection = false;
                    if (direction === 'left' && dx < -10) isInDirection = true;
                    if (direction === 'right' && dx > 10) isInDirection = true;
                    if (direction === 'up' && dy < -10) isInDirection = true;
                    if (direction === 'down' && dy > 10) isInDirection = true;

                    if (isInDirection) {
                        const weight = (direction === 'left' || direction === 'right') ? 2.5 : 1.0;
                        const distance = Math.sqrt(
                            (direction === 'left' || direction === 'right')
                                ? (dx * dx) + (dy * dy * weight)
                                : (dx * dx * weight) + (dy * dy)
                        );

                        if (distance < shortestDistance) {
                            shortestDistance = distance;
                            bestCandidate = candidate;
                        }
                    }
                });

                return bestCandidate;
            }

            function focusElement(element) {
                if (!element) return;
                if (currentFocusedElement) {
                    currentFocusedElement.classList.remove('focused');
                }

                currentFocusedElement = element;
                currentFocusedElement.classList.add('focused');

                const focusEvent = new CustomEvent('itemFocus', { detail: { element: currentFocusedElement } });
                currentFocusedElement.dispatchEvent(focusEvent);

                updateGlowPosition(currentFocusedElement);
            }

            function updateGlowPosition(element) {
                const rect = element.getBoundingClientRect();
                focusGlowBox.style.width = `${rect.width}px`;
                focusGlowBox.style.height = `${rect.height}px`;
                focusGlowBox.style.transform = `translate3d(${rect.left}px, ${rect.top}px, 0)`;
                focusGlowBox.classList.add('active');
            }

            function autoScrollContainer(element, direction) {
                const railTrack = element.closest('.rail-track');
                if (railTrack) {
                    const card = element.closest('.card');
                    if (card) {
                        const trackRect = railTrack.parentElement.getBoundingClientRect();
                        const cardRect = card.getBoundingClientRect();
                        
                        let currentTranslateX = getTranslateX(railTrack);
                        
                        if (direction === 'left' && cardRect.left < trackRect.left + 100) {
                            currentTranslateX += (cardRect.width + 20);
                        } else if (direction === 'right' && cardRect.right > trackRect.right - 100) {
                            currentTranslateX -= (cardRect.width + 20);
                        }
                        
                        if (currentTranslateX > 0) currentTranslateX = 0;
                        railTrack.style.transform = `translate3d(${currentTranslateX}px, 0, 0)`;
                        requestAnimationFrame(() => updateGlowPosition(element));
                    }
                }

                const railsContainer = document.getElementById('rails-container');
                const railGroup = element.closest('.rail-group');
                if (railGroup && railsContainer) {
                    const groupRect = railGroup.getBoundingClientRect();
                    let currentTranslateY = getTranslateY(railsContainer);

                    if (direction === 'down' && groupRect.bottom > window.innerHeight - 50) {
                        currentTranslateY -= 220;
                    } else if (direction === 'up' && groupRect.top < 280) {
                        currentTranslateY += 220;
                    }

                    if (currentTranslateY > 0) currentTranslateY = 0;
                    railsContainer.style.transform = `translate3d(0, ${currentTranslateY}px, 0)`;
                    requestAnimationFrame(() => updateGlowPosition(element));
                }
            }

            function getTranslateX(el) {
                const style = window.getComputedStyle(el);
                const matrix = new WebKitCSSMatrix(style.transform);
                return matrix.m41;
            }

            function getTranslateY(el) {
                const style = window.getComputedStyle(el);
                const matrix = new WebKitCSSMatrix(style.transform);
                return matrix.m42;
            }

            return {
                init: init,
                focusElement: focusElement,
                updateGlow: () => { if (currentFocusedElement) updateGlowPosition(currentFocusedElement); }
            };
        })();

        /* التحكم الرئيسي وتدفق الواجهات */
        const App = (function () {
            let currentQuery = "";
            let previousView = 'main-view';

            function init() {
                renderHero();
                renderRails();
                buildVirtualKeyboard();
                SpatialNavigation.init();
                
                const firstFocusable = document.querySelector('.nav-item');
                if (firstFocusable) {
                    SpatialNavigation.focusElement(firstFocusable);
                }

                bindEvents();
            }

            function renderHero() {
                const data = MOCK_DATA.hero;
                document.getElementById('hero-title').innerText = data.title;
                document.getElementById('hero-year').innerText = data.year;
                document.getElementById('hero-rating').innerText = `★ ${data.rating}`;
                document.getElementById('hero-type').innerText = data.type;
                document.getElementById('hero-description').innerText = data.description;
                document.getElementById('hero-backdrop').style.backgroundImage = `url('${data.backdrop}')`;
            }

            function renderRails() {
                const container = document.getElementById('rails-container');
                container.innerHTML = '';

                MOCK_DATA.sections.forEach(section => {
                    const group = document.createElement('div');
                    group.className = 'rail-group';

                    const title = document.createElement('div');
                    title.className = 'rail-title';
                    title.innerText = section.title;
                    group.appendChild(title);

                    const track = document.createElement('div');
                    track.className = 'rail-track';

                    section.items.forEach(item => {
                        const card = document.createElement('div');
                        card.className = 'card focusable';
                        card.dataset.id = item.id;

                        card.innerHTML = `
                            <img src="${item.poster}" alt="${item.title}" decoding="async" loading="lazy">
                            <div class="card-info">
                                <div class="card-title">${item.title}</div>
                            </div>
                        `;

                        card.addEventListener('click', () => openDetails(item));
                        
                        card.addEventListener('itemFocus', () => {
                            document.getElementById('hero-title').innerText = item.title;
                            document.getElementById('hero-year').innerText = item.year;
                            document.getElementById('hero-rating').innerText = `★ ${item.rating}`;
                            document.getElementById('hero-description').innerText = item.description;
                            document.getElementById('hero-backdrop').style.backgroundImage = `url('${item.backdrop}')`;
                        });

                        track.appendChild(card);
                    });

                    group.appendChild(track);
                    container.appendChild(group);
                });
            }

            function openDetails(item) {
                previousView = document.querySelector('.view-section.active-view').id;
                switchView('details-view');

                document.getElementById('details-title').innerText = item.title;
                document.getElementById('details-year').innerText = item.year;
                document.getElementById('details-rating').innerText = `★ ${item.rating}`;
                document.getElementById('details-category').innerText = item.type === 'movie' ? 'فيلم سينمائي' : 'مسلسل';
                document.getElementById('details-description').innerText = item.description;
                document.getElementById('details-poster').src = item.poster;
                document.getElementById('details-backdrop').style.backgroundImage = `url('${item.backdrop}')`;

                const epSection = document.getElementById('episodes-section');
                const epRail = document.getElementById('episodes-rail');
                
                if (item.type === 'series' && item.episodes) {
                    document.getElementById('details-episodes-count').innerText = `${item.episodes} حلقة`;
                    document.getElementById('details-episodes-count').classList.remove('hidden');
                    epSection.classList.remove('hidden');
                    epRail.innerHTML = '';

                    for (let i = 1; i <= item.episodes; i++) {
                        const epCard = document.createElement('div');
                        epCard.className = 'btn btn-secondary focusable';
                        epCard.innerText = `الحلقة ${i}`;
                        epRail.appendChild(epCard);
                    }
                } else {
                    document.getElementById('details-episodes-count').classList.add('hidden');
                    epSection.classList.add('hidden');
                }

                setTimeout(() => {
                    SpatialNavigation.focusElement(document.getElementById('details-play-btn'));
                }, 50);
            }

            function buildVirtualKeyboard() {
                const keyboardGrid = document.getElementById('virtual-keyboard');
                const keys = [
                    'أ', 'ب', 'ت', 'ث', 'ج', 'ح',
                    'خ', 'د', 'ذ', 'ر', 'ز', 'س',
                    'ش', 'ص', 'ض', 'ط', 'ظ', 'ع',
                    'غ', 'ف', 'ق', 'ك', 'ل', 'م',
                    'ن', 'هـ', 'و', 'ي', 'مسافة', 'مسح'
                ];

                keyboardGrid.innerHTML = '';
                keys.forEach(k => {
                    const btn = document.createElement('button');
                    btn.className = 'key-btn focusable';
                    if (k === 'مسافة' || k === 'مسح') btn.classList.add('wide');
                    btn.innerText = k;

                    btn.addEventListener('click', () => {
                        if (k === 'مسح') {
                            currentQuery = currentQuery.slice(0, -1);
                        } else if (k === 'مسافة') {
                            currentQuery += ' ';
                        } else {
                            currentQuery += k;
                        }
                        updateSearch();
                    });

                    keyboardGrid.appendChild(btn);
                });
            }

            function updateSearch() {
                const display = document.getElementById('search-display-text');
                display.innerText = currentQuery.length > 0 ? currentQuery : 'ابحث عن أفلام، مسلسلات...';

                const resultsGrid = document.getElementById('search-results-grid');
                resultsGrid.innerHTML = '';

                if (currentQuery.trim() === '') return;

                let allItems = [];
                MOCK_DATA.sections.forEach(s => allItems = allItems.concat(s.items));
                
                const filtered = allItems.filter(i => i.title.includes(currentQuery));
                filtered.forEach(item => {
                    const card = document.createElement('div');
                    card.className = 'card focusable';
                    card.innerHTML = `
                        <img src="${item.poster}" alt="${item.title}">
                        <div class="card-info"><div class="card-title">${item.title}</div></div>
                    `;
                    card.addEventListener('click', () => openDetails(item));
                    resultsGrid.appendChild(card);
                });
            }

            function switchView(viewId) {
                document.querySelectorAll('.view-section').forEach(v => v.classList.remove('active-view'));
                const target = document.getElementById(viewId);
                if (target) target.classList.add('active-view');
                setTimeout(() => SpatialNavigation.updateGlow(), 50);
            }

            function bindEvents() {
                document.querySelectorAll('.nav-item').forEach(btn => {
                    btn.addEventListener('click', (e) => {
                        const nav = e.target.dataset.nav;
                        if (nav === 'search') {
                            previousView = 'main-view';
                            switchView('search-view');
                            setTimeout(() => {
                                const firstKey = document.querySelector('.key-btn');
                                if (firstKey) SpatialNavigation.focusElement(firstKey);
                            }, 50);
                        } else {
                            switchView('main-view');
                        }
                    });
                });

                document.getElementById('details-back-btn').addEventListener('click', () => {
                    handleBackKey();
                });
            }

            function handleBackKey() {
                const activeView = document.querySelector('.view-section.active-view').id;
                if (activeView === 'details-view' || activeView === 'search-view') {
                    switchView(previousView);
                    setTimeout(() => {
                        const firstCard = document.querySelector('.card.focusable');
                        if (firstCard) SpatialNavigation.focusElement(firstCard);
                    }, 50);
                }
            }

            return {
                init: init,
                handleBackKey: handleBackKey
            };
        })();

        document.addEventListener('DOMContentLoaded', App.init);
    </script>
</body>
</html>
